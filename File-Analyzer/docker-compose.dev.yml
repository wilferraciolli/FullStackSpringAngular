services:
  db:
    image: postgres:17-alpine
    container_name: file-analyzer-db-dev
    environment:
      POSTGRES_DB: file_analyzer
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d file_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

volumes:
  postgres_data_dev:
