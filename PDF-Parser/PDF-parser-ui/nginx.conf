server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Matches spring.servlet.multipart.max-file-size / max-request-size in pdf-parser-api's
  # application.yml (default is 1m, far too small for document uploads).
  client_max_body_size 50m;

  location /api/ {
    proxy_pass http://pdf-parser-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
