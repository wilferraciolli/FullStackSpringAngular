spring:
  application:
    name: data-explore-api

  # Load secrets from .env — tried in both locations because IntelliJ's working directory
  # can be the project root (DataExplorer/) or the module root (data-explore-api/)
  # depending on how the run configuration is set up.
  config:
    import:
      - optional:file:.env[.properties]                      # works when CWD = data-explore-api/
      - optional:file:data-explore-api/.env[.properties]     # works when CWD = DataExplorer/

  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    cors:
      allowed-origins: "*"

# AI configuration — used by AiService (Groq fallback when Chrome AI is unavailable)
# Get a free key at https://console.groq.com → API Keys → Create Key
ai:
  groq:
    api-key: ${GROQ_API_KEY:}
    url: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.1-8b-instant
    # Set to true when behind a corporate firewall that does SSL inspection (MITM).
    # This disables certificate validation for Groq requests only — do NOT enable in production.
    trust-all-certs: ${AI_GROQ_TRUST_ALL_CERTS:false}


