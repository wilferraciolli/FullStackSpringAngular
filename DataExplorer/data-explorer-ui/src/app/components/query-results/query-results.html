<div class="QueryResults-container">
  @if (isExecuting()) {
    <span class="QueryResults-loading">Running query…</span>
  } @else if (queryError()) {
    <p class="QueryResults-results-error">{{ queryError() }}</p>
  } @else if (rowData().length > 0) {

    <!-- Toolbar -->
    <div class="QueryResults-toolbar">
      <span class="QueryResults-toolbar-count">
        {{ rowData().length }} row{{ rowData().length === 1 ? '' : 's' }}
      </span>
      <button mat-stroked-button
              color="primary"
              (click)="exportCsv()"
              matTooltip="Download visible rows as CSV">
        <mat-icon>download</mat-icon>
        Export CSV
      </button>
    </div>

    <ag-grid-angular
      style="width: 100%; height: 500px;"
      [theme]="theme"
      [rowData]="rowData()"
      [columnDefs]="colDefs()"
      [defaultColDef]="defaultColDef"
      (gridReady)="onGridReady($event)"
    />

  } @else {
    <p class="QueryResults-results-empty">Nothing to see here, try refining your query.</p>
  }
</div>
